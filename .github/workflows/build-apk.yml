name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # ubuntu-22.04: cần libtinfo5 (không có trên 24.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # Tự tìm dự án: (1) buildozer.spec nằm ở gốc repo hoặc thư mục con; (2) nếu repo chỉ chứa FILE .zip của dự án
      # (upload nguyên file zip - GitHub KHÔNG tự giải nén) thì tự giải nén zip đó rồi build.
      - name: Locate project (buildozer.spec / tự giải nén zip)
        id: proj
        shell: bash
        run: |
          find_spec() { find "$1" -maxdepth 4 -name buildozer.spec -not -path "*/.buildozer/*" -not -path "*/.git/*" | head -n 1; }
          SPEC=$(find_spec .)
          if [ -z "$SPEC" ]; then
            echo "Không thấy buildozer.spec -> tìm file .zip chứa dự án để giải nén..."
            while IFS= read -r Z; do
              if unzip -Z1 "$Z" 2>/dev/null | grep -q 'buildozer.spec$'; then
                echo "Giải nén: $Z"
                rm -rf _src && mkdir -p _src && unzip -q -o "$Z" -d _src
                break
              fi
            done < <(find . -maxdepth 4 -name '*.zip' -not -path "./.git/*" -not -path "./_src/*")
            SPEC=$(find_spec ./_src)
          fi
          if [ -z "$SPEC" ]; then
            echo "::error::Không tìm thấy buildozer.spec (cũng không có file .zip nào chứa nó). Hãy giải nén pyea-runner.zip rồi đẩy các file bên trong lên repo. Cấu trúc hiện có:"
            find . -maxdepth 3 -not -path "./.git/*" | head -n 60
            exit 1
          fi
          DIR=$(dirname "$SPEC")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Dự án nằm ở: $DIR"
          ls -la "$DIR"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # BẮT BUỘC JDK 17: máy chủ GitHub mặc định dùng JDK 11 (JAVA_HOME trỏ tới Temurin 11), còn Gradle/AGP của
      # python-for-android và sdkmanager cần JDK 17. setup-java đặt lại JAVA_HOME (buildozer tự dùng JAVA_HOME).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Khôi phục cache (SDK/NDK/p4a đã tải + phần đã biên dịch). Cache được LƯU CẢ KHI BUILD LỖI (bước 'Save cache')
      # nên lần chạy lại không phải làm lại từ đầu.
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            ${{ steps.proj.outputs.dir }}/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('**/buildozer.spec') }}-${{ github.run_id }}
          restore-keys: |
            buildozer-${{ runner.os }}-${{ hashFiles('**/buildozer.spec') }}-
            buildozer-${{ runner.os }}-

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 "cython==0.29.37" virtualenv setuptools

      - name: Versions
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version
          python --version
          buildozer --version || true

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            ${{ steps.proj.outputs.dir }}/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('**/buildozer.spec') }}-${{ github.run_id }}

      # Log buildozer rất dài nên giao diện GitHub hay cắt mất dòng lỗi: in riêng phần lỗi ở đây.
      - name: Show error summary
        if: failure()
        working-directory: ${{ steps.proj.outputs.dir }}
        shell: bash
        run: |
          LOG=build.log
          [ -f "$LOG" ] || { echo "Không có build.log (lỗi xảy ra trước khi build)"; exit 0; }
          {
            echo "### Các dòng lỗi trong log buildozer"
            echo '```'
            grep -n -i -E "error|exception|failed|not found|traceback|FAILURE|could not|requires java" "$LOG" | tail -n 40
            echo '```'
            echo "### 80 dòng cuối"
            echo '```'
            tail -n 80 "$LOG"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: ${{ steps.proj.outputs.dir }}/build.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyearunner-apk
          path: ${{ steps.proj.outputs.dir }}/bin/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release (khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.proj.outputs.dir }}/bin/*.apk
