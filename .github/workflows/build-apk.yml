name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # ubuntu-22.04: cần libtinfo5 (không có trên 24.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Tự tìm dự án: (1) buildozer.spec nằm ở gốc repo hoặc thư mục con; (2) nếu repo chỉ chứa FILE .zip của dự án
      # (upload nguyên file zip lên GitHub - GitHub KHÔNG tự giải nén) thì tự giải nén zip đó rồi build.
      - name: Locate project (buildozer.spec / tự giải nén zip)
        id: proj
        shell: bash
        run: |
          find_spec() { find "$1" -maxdepth 4 -name buildozer.spec -not -path "*/.buildozer/*" -not -path "*/.git/*" | head -n 1; }
          SPEC=$(find_spec .)
          if [ -z "$SPEC" ]; then
            echo "Không thấy buildozer.spec -> tìm file .zip chứa dự án để giải nén..."
            while IFS= read -r Z; do
              if unzip -Z1 "$Z" 2>/dev/null | grep -q 'buildozer.spec$'; then
                echo "Giải nén: $Z"
                rm -rf _src && mkdir -p _src && unzip -q -o "$Z" -d _src
                break
              fi
            done < <(find . -maxdepth 4 -name '*.zip' -not -path "./.git/*" -not -path "./_src/*")
            SPEC=$(find_spec ./_src)
          fi
          if [ -z "$SPEC" ]; then
            echo "::error::Không tìm thấy buildozer.spec (cũng không có file .zip nào chứa nó). Hãy giải nén pyea-runner.zip rồi đẩy các file bên trong lên repo. Cấu trúc hiện có:"
            find . -maxdepth 3 -not -path "./.git/*" | head -n 60
            exit 1
          fi
          DIR=$(dirname "$SPEC")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Dự án nằm ở: $DIR"
          ls -la "$DIR"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache buildozer (SDK/NDK + p4a)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ${{ steps.proj.outputs.dir }}/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('**/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 "cython==0.29.37" virtualenv setuptools

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyearunner-apk
          path: ${{ steps.proj.outputs.dir }}/bin/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release (khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.proj.outputs.dir }}/bin/*.apk
